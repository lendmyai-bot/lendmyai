<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>

<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --surface-2: #f1f1f4; --border: #e3e3e8;
    --text: #18181b; --muted: #6b6b76; --accent: #5b3ee6; --accent-soft: #ece8fd;
    --ok: #16794a; --ok-soft: #e3f5ec; --warn: #9a5b00; --warn-soft: #fdf1dc;
    --danger: #b42318; --danger-soft: #fde8e6; --term-bg: #121216; --term-text: #e4e4e7;
    --radius: 10px; --shadow: 0 1px 2px rgb(0 0 0 / .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f12; --surface: #18181c; --surface-2: #222228; --border: #2e2e36;
      --text: #ececf1; --muted: #9c9ca8; --accent: #9b87ff; --accent-soft: #2a2350;
      --ok: #4ccf8e; --ok-soft: #13301f; --warn: #f0b252; --warn-soft: #36290f;
      --danger: #ff8a7f; --danger-soft: #3a1714; --term-bg: #0a0a0c;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
  .bar { max-width: 1200px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 24px; }
  .logo { font-weight: 700; font-size: 16px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .logo-mark { width: 24px; height: 24px; flex: none; display: block; }
  nav { display: flex; gap: 4px; }
  nav a { color: var(--muted); padding: 6px 10px; border-radius: 8px; font-weight: 500; }
  nav a.active, nav a:hover { color: var(--text); background: var(--surface-2); text-decoration: none; }
  @media (max-width: 600px) {
    .bar { height: auto; flex-wrap: wrap; gap: 8px 12px; padding-top: 10px; padding-bottom: 8px; }
    nav { order: 3; width: 100%; margin-left: -10px; }
  }
  .who { margin-left: auto; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  h3 { font-size: 14px; margin: 20px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-size: 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .toolbar input { flex: 1; min-width: 200px; width: auto; }
  .toolbar select { width: auto; flex: 0 1 auto; max-width: 100%; }
  .toolbar .check { display: inline-flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; user-select: none; white-space: nowrap; }
  .toolbar .check:hover { background: var(--surface-2); }
  .toolbar .check input { flex: none; width: 16px; height: 16px; min-width: 0; padding: 0; margin: 0; accent-color: var(--accent); }
  @media (max-width: 600px) {
    .toolbar input[type=search] { flex: 1 1 100%; }
    .toolbar select { flex: 1 1 140px; }
    .toolbar .check { flex: 1 1 100%; }
  }
  button { font: inherit; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { background: var(--surface-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .cols { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
  .col { background: var(--surface-2); border-radius: var(--radius); padding: 12px; min-height: 120px; }
  .col-head { display: flex; justify-content: space-between; font-weight: 600; margin: 2px 4px 10px; }
  .col-head .n { color: var(--muted); font-weight: 500; }
  .card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; color: var(--text); box-shadow: var(--shadow); }
  .card:hover { border-color: var(--accent); text-decoration: none; }
  .card .ref { color: var(--muted); font-size: 12px; }
  .card .title { font-weight: 600; margin: 2px 0 8px; overflow-wrap: anywhere; }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; font-size: 13px; }

  .pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }
  .pill.danger { background: var(--danger-soft); color: var(--danger); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .panel + .panel { margin-top: 16px; }
  .layout > .panel { margin-top: 0; }
  .banner { border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.danger { background: var(--danger-soft); color: var(--danger); }
  .banner.ok { background: var(--ok-soft); color: var(--ok); }
  .banner.info { background: var(--accent-soft); color: var(--accent); }
  .md { overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md pre { background: var(--surface-2); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .md img { max-width: 100%; }
  .back { display: inline-block; margin-bottom: 12px; color: var(--muted); }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-weight: 500; margin-bottom: 4px; }
  .field .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .stack > * + * { margin-top: 8px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .cmd { display: flex; gap: 6px; align-items: center; background: var(--surface-2); border-radius: 8px; padding: 6px 6px 6px 10px; }
  .cmd code { flex: 1; overflow-x: auto; white-space: nowrap; }
  .cmd button { padding: 4px 10px; font-size: 12px; }

  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { padding: 8px 0; border-top: 1px solid var(--border); }
  .timeline li:first-child { border-top: 0; }
  .timeline .when { color: var(--muted); font-size: 12px; }
  .timeline .note { margin-top: 6px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font-size: 13px; }

  .term { background: var(--term-bg); color: var(--term-text); border-radius: var(--radius); padding: 14px; height: 440px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .term .tool { color: #a5b4fc; } .term .ok { color: #6ee7a8; } .term .err { color: #fca5a5; }
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .choices button { text-align: left; padding: 10px 12px; white-space: normal; }
  .choices small { display: block; font-weight: 400; opacity: .8; }

  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 10px 8px; border-top: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }
  td.right, th.right { text-align: right; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card.project { margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 16px; }
  .card.project .desc { color: var(--muted); margin: 0; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .avatar { width: 24px; height: 24px; border-radius: 6px; flex: none; }
  .avatar.big { width: 48px; height: 48px; border-radius: 10px; }
  .meta { color: var(--muted); font-size: 13px; gap: 12px; flex-wrap: wrap; }
  .lead { font-size: 16px; margin: 0 0 16px; max-width: 760px; }
  .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stats div { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; min-width: 120px; }
  .stats b { display: block; font-size: 22px; }
  .stats span { color: var(--muted); font-size: 13px; }
  .flow { list-style: none; padding: 0; margin: 0 0 12px; counter-reset: step; }
  .flow > li { position: relative; padding: 0 0 18px 38px; counter-increment: step; display: flex; flex-direction: column; gap: 6px; }
  .flow > li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .flow > li.done::before { content: "✓"; background: var(--ok-soft); color: var(--ok); }
  .flow > li > span { color: var(--muted); font-size: 13px; }
  .flow > li > button.linkish { align-self: flex-start; }
  .flow .steps { font-size: 13px; padding-left: 18px; margin: 4px 0 10px; }
  .flow .steps li { margin-bottom: 8px; }
  .fine { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .panel.plan { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; border-color: var(--accent); }
  .panel.plan > div:first-child { display: flex; flex-direction: column; gap: 4px; max-width: 640px; }
  .panel.plan span { color: var(--muted); font-size: 14px; }
  .panel.plan #plan { min-width: 220px; }
  .advanced { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .advanced summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .advanced .steps { margin-top: 10px; font-size: 13px; }
  button.linkish { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 13px; text-decoration: underline; }
  button.linkish:hover:not(:disabled) { background: none; color: var(--danger); }
  .steps { padding-left: 20px; margin: 0 0 12px; }
  .steps li { margin-bottom: 12px; }
  .hero { text-align: center; max-width: 680px; margin: 48px auto 40px; }
  .hero h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.15; margin-bottom: 14px; }
  .hero p { color: var(--muted); font-size: 17px; margin: 0 0 24px; }
  .hero .fine { font-size: 13px; margin-top: 12px; }
  button.big { font-size: 16px; padding: 12px 22px; }
  .how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 760px) { .how { grid-template-columns: 1fr; } }
  .how .panel { margin-top: 0; }
  .how p { color: var(--muted); margin: 0; }
  .num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; margin-bottom: 10px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; max-width: calc(100% - 32px); z-index: 10; }
  .site-footer { max-width: 1100px; margin: 40px auto 0; padding: 24px 16px 32px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; text-align: center; display: grid; gap: 6px; }
  .site-footer .legal { font-size: 12px; max-width: 640px; margin: 6px auto 0; }

  .suggestion { display: flex; gap: 12px; align-items: flex-start; }
  button.vote { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 12px; line-height: 1; min-width: 46px; }
  button.vote span { font-size: 13px; font-weight: 700; }
  button.vote.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .suggestion .desc { margin: 4px 0 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>

<script>
const main = document.getElementById("main");
let me = { login: "", agents: [] };
let pollTimer = null;
// Tasks the viewer chose to work on anyway, even though someone else already claimed them or opened a PR.
const forcedTasks = new Set();

// ---------- helpers ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

if (window.DOMPurify) {
  DOMPurify.addHook("afterSanitizeAttributes", (n) => { if (n.tagName === "A") { n.target = "_blank"; n.rel = "noopener noreferrer"; } });
}
function md(text) {
  if (!text?.trim()) return `<p class="sub">No description.</p>`;
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text));
  return `<p style="white-space:pre-wrap">${esc(text)}</p>`;
}

async function call(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: method === "POST" ? { "Content-Type": "application/json" } : {},
    body: method === "POST" ? JSON.stringify(body ?? {}) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const ago = (iso) => {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
};
const until = (iso) => { const h = (new Date(iso) - Date.now()) / 3600000; return h < 1 ? `${Math.max(1, Math.round(h * 60))}m left` : `${Math.round(h)}h left`; };
/** Contributors who connect through Claude have a display name instead of a GitHub login. */
const personName = (x) => (x.name ? x.name : "@" + x.user);
const CONNECTOR_URL = "https://lendmyai.com/mcp";
// Opens Claude's "Add custom connector" dialog with lendmyai prefilled.
const ADD_CONNECTOR_URL = `https://claude.ai/customize/connectors?modal=add-custom-connector&connectorName=lendmyai&connectorUrl=${encodeURIComponent(CONNECTOR_URL)}`;
/** Whether this browser has connected Claude to lendmyai (known from the connect page cookie). */
let connector = { connected: false };
async function refreshConnector() {
  try { connector = await call("GET", "/api/connector"); } catch {}
  return connector;
}
const claudeTaskUrl = (t) => `https://claude.ai/new?q=${encodeURIComponent(`Please do this lendmyai task for me: ${t.ref} "${t.title}"`)}`;

/** Shown under a button when this browser hasn't connected lendmyai to Claude yet. Never blocks. */
const firstTimeLink = () => connector.connected ? "" :
  `<p class="fine" style="text-align:center">First time? <a href="${esc(ADD_CONNECTOR_URL)}" target="_blank" rel="noopener">Add lendmyai to Claude</a> (one click), then use the button.</p>`;

/** The single button: always straight to Claude with the task typed in. */
function doTaskHtml(t) {
  return `<a href="${esc(claudeTaskUrl(t))}" target="_blank" rel="noopener"><button class="primary big" style="width:100%">Do this task with Claude</button></a>
    <p class="fine" style="text-align:center">Free with any Claude plan. No GitHub or coding needed.</p>${firstTimeLink()}`;
}

/** Owners: the plan link carries a fresh owner key, so Claude can post tasks as them without reconnecting. */
async function loadPlanButton(full) {
  const box = document.getElementById("plan");
  if (!box) return;
  try {
    const { claudeUrl } = await call("GET", `/api/plan/${full}`);
    box.innerHTML = `<a href="${esc(claudeUrl)}" target="_blank" rel="noopener"><button class="primary">Plan tasks with Claude</button></a>${firstTimeLink()}`;
  } catch (e) {
    box.innerHTML = `<p class="fine">${esc(e.message)}</p>`;
  }
}

const splitRef = (ref) => { const m = /^(.+?)\/(.+?)#(\d+)$/.exec(ref); return m ? [m[1], m[2], m[3]] : []; };
const taskHref = (ref) => `#/task/${splitRef(ref).join("/")}`;

function priorityPill(priority) {
  if (!priority) return "";
  const cls = { high: "danger", medium: "warn", low: "" }[priority] ?? "";
  return `<span class="pill ${cls}">${esc(priority)}</span>`;
}

function statePill(s) {
  if (s.kind === "available") return s.handoff ? `<span class="pill warn">resumable · ${esc(personName(s.handoff))}</span>` : `<span class="pill ok">available</span>`;
  if (s.kind === "failed") return `<span class="pill danger">failed</span>`;
  if (s.kind === "claimed") return `<span class="pill accent">${esc(personName(s))} · ${esc(s.agent)} · ${until(s.expires)}</span>`;
  return `<span class="pill">PR #${esc(s.pr)} · ${esc(personName(s))}</span>`;
}

function errorBox(e) { return `<div class="banner danger">${esc(e.message || e)}</div>`; }
const loading = (what) => `<p class="sub"><span class="spinner"></span>&nbsp; Loading ${what}…</p>`;

// ---------- router ----------
async function render() {
  clearInterval(pollTimer);
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  const view = parts[0] || "projects";
  const navFor = { task: "projects", project: "projects", run: "runs" };
  document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("active", a.dataset.nav === (navFor[view] ?? view)));
  window.scrollTo(0, 0);
  try {
    if (view === "task") return await viewTask(parts[1], parts[2], parts[3]);
    if (view === "project" && parts[3] === "new") return await viewNewTask(parts[1], parts[2]);
    if (view === "project") return await viewProject(parts[1], parts[2]);
    if (view === "run") return await viewRun(parts[1]);
    if (view === "review") return await viewReview(parts[1]);
    if (view === "auto") return await viewAuto(parts[1]);
    if (view === "publish") return await viewPublish();
    if (view === "runs") return await viewRuns();
    return await viewProjects();
  } catch (e) {
    main.innerHTML = errorBox(e);
  }
}
window.addEventListener("hashchange", render);

const projectHref = (fullName) => `#/project/${fullName}`;
const repoOfRef = (ref) => ref.split("#")[0];

// ---------- projects ----------
// "recent" keeps the order the API returns (GitHub's most recently updated first),
// so the default view is exactly what it was before the toolbar existed.
const PROJECT_SORTS = [
  ["recent", "Recently updated"],
  ["tasks", "Most open tasks"],
  ["stars", "Most stars"],
  ["newest", "Newest"],
  ["name", "Name A-Z"],
];

async function viewProjects() {

/** Applies search, language, "open tasks only" and sort to the loaded list. Returns a new array. */
function filterProjects(projects, f) {
  const terms = f.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const time = (iso) => Date.parse(iso) || 0;
  const order = {
    recent: () => 0,
    tasks: (a, b) => b.p.openTasks - a.p.openTasks,
    stars: (a, b) => b.p.stars - a.p.stars,
    newest: (a, b) => time(b.p.createdAt) - time(a.p.createdAt),
    name: (a, b) => a.p.fullName.localeCompare(b.p.fullName, undefined, { sensitivity: "base" }),
  }[f.sort] || (() => 0);
  return projects
    .map((p, i) => ({ p, i }))
    .filter(({ p }) => {
      if (f.lang && p.language !== f.lang) return false;
      if (f.open && !(p.openTasks > 0)) return false;
      const hay = `${p.fullName} ${p.description}`.toLowerCase();
      return terms.every((t) => hay.includes(t));
    })
    .sort((a, b) => order(a, b) || a.i - b.i)
    .map(({ p }) => p);
}

/** Toolbar + grid for the Projects page. Only the grid is redrawn while typing, so the search box keeps focus. */
function mountProjectBrowser(box, projects) {
  const langs = [...new Set(projects.map((p) => p.language).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const f = {
    q: store.get("projects.q"),
    lang: store.get("projects.lang"),
    open: store.get("projects.open") === "1",
    sort: store.get("projects.sort"),
  };
  // Saved choices can be stale (a language that is no longer listed, an unknown sort).
  if (!langs.includes(f.lang)) f.lang = "";
  if (!PROJECT_SORTS.some(([k]) => k === f.sort)) f.sort = "recent";

  box.innerHTML = `
    <div class="toolbar" role="search">
      <input type="search" id="p-q" placeholder="Search projects…" aria-label="Search projects" autocomplete="off" value="${esc(f.q)}">
      <select id="p-lang" aria-label="Language">
        <option value="">All languages</option>
        ${langs.map((l) => `<option value="${esc(l)}"${l === f.lang ? " selected" : ""}>${esc(l)}</option>`).join("")}
      </select>
      <select id="p-sort" aria-label="Sort by">
        ${PROJECT_SORTS.map(([k, label]) => `<option value="${k}"${k === f.sort ? " selected" : ""}>${label}</option>`).join("")}
      </select>
      <label class="check"><input type="checkbox" id="p-open"${f.open ? " checked" : ""}> Only with open tasks</label>
    </div>
    <p class="fine" id="p-count" aria-live="polite" style="margin:-8px 0 12px"></p>
    <div id="p-grid"></div>`;

  const qEl = box.querySelector("#p-q");
  const langEl = box.querySelector("#p-lang");
  const sortEl = box.querySelector("#p-sort");
  const openEl = box.querySelector("#p-open");
  const countEl = box.querySelector("#p-count");
  const grid = box.querySelector("#p-grid");

  const save = () => {
    store.set("projects.q", f.q);
    store.set("projects.lang", f.lang);
    store.set("projects.open", f.open ? "1" : "");
    store.set("projects.sort", f.sort);
  };

  const apply = () => {
    const shown = filterProjects(projects, f);
    countEl.textContent = shown.length === projects.length
      ? `${projects.length} project${projects.length === 1 ? "" : "s"}`
      : `Showing ${shown.length} of ${projects.length} project${projects.length === 1 ? "" : "s"}`;
    grid.innerHTML = shown.length
      ? `<div class="grid">${shown.map(projectCard).join("")}</div>`
      : `<div class="panel empty">No projects match your filters.<br>Try different search words, or clear the filters to see everything.<div style="margin-top:12px"><button id="p-clear">Clear filters</button></div></div>`;
  };

  qEl.addEventListener("input", () => { f.q = qEl.value; save(); apply(); });
  langEl.addEventListener("change", () => { f.lang = langEl.value; save(); apply(); });
  sortEl.addEventListener("change", () => { f.sort = sortEl.value; save(); apply(); });
  openEl.addEventListener("change", () => { f.open = openEl.checked; save(); apply(); });
  grid.addEventListener("click", (e) => {
    if (!e.target.closest("#p-clear")) return;
    f.q = ""; f.lang = ""; f.open = false;
    qEl.value = ""; langEl.value = ""; openEl.checked = false;
    save(); apply();
  });

  apply();
}

    <p class="desc">${esc(p.description) || "<span class=sub>No description</span>"}</p>
    <div class="row meta">
      <span class="pill ${p.openTasks ? "ok" : ""}">${p.openTasks} open task${p.openTasks === 1 ? "" : "s"}</span>
      ${p.language ? `<span>${esc(p.language)}</span>` : ""}<span>★ ${p.stars}</span>

}

// ---------- suggestions ----------
async function loadSuggestions(o, r, canManage) {
  const box = document.getElementById("suggestions");
  if (!box) return;
  try {
    const list = await call("GET", `/api/projects/${o}/${r}/suggestions`);
    renderSuggestions(box, o, r, list, canManage);
  } catch (e) {
    box.innerHTML = errorBox(e);
  }
}

function renderSuggestions(box, o, r, list, canManage) {
  const base = `/api/projects/${o}/${r}/suggestions`;
  box.innerHTML = `
    ${signedOut() ? "" : `<form class="panel" id="suggest-form" style="margin-bottom:12px">
      <div class="field"><input id="suggest-title" required maxlength="200" placeholder="Suggest something for this project…"></div>
      <div class="field"><textarea id="suggest-body" placeholder="Details (optional)"></textarea></div>
      <button class="primary" type="submit">Add suggestion</button>
    </form>`}
    ${list.length ? `<div class="stack">${list.map((s) => suggestionCard(s, canManage)).join("")}</div>`
      : `<div class="panel empty">No suggestions yet.${signedOut() ? "" : " Be the first to add one."}</div>`}`;

  document.getElementById("suggest-form")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button[type=submit]");
    const title = document.getElementById("suggest-title").value;
    const body = document.getElementById("suggest-body").value;
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Adding…`;
    try {
      await call("POST", base, { title, body });
      toast("Suggestion added");
      loadSuggestions(o, r, canManage);
    } catch (err) {
      toast(err.message); btn.disabled = false; btn.textContent = "Add suggestion";
    }
  });

  box.querySelectorAll("[data-vote]").forEach((btn) => btn.addEventListener("click", async () => {
    btn.disabled = true;
    try { await call("POST", `${base}/${btn.dataset.vote}/vote`); loadSuggestions(o, r, canManage); }
    catch (e) { toast(e.message); btn.disabled = false; }
  }));

  box.querySelectorAll("[data-approve]").forEach((btn) => btn.addEventListener("click", async () => {
    btn.disabled = true;
    try { await call("POST", `${base}/${btn.dataset.approve}/approve`); toast("Approved — it's now a task"); loadSuggestions(o, r, canManage); render(); }
    catch (e) { toast(e.message); btn.disabled = false; }
  }));

  box.querySelectorAll("[data-decline]").forEach((btn) => btn.addEventListener("click", async () => {
    if (!confirm("Decline this suggestion?")) return;
    btn.disabled = true;
    try { await call("POST", `${base}/${btn.dataset.decline}/decline`); toast("Suggestion declined"); loadSuggestions(o, r, canManage); }
    catch (e) { toast(e.message); btn.disabled = false; }
  }));
}

function suggestionCard(s, canManage) {
  return `<div class="panel suggestion">
    <button class="vote${s.voted ? " active" : ""}" data-vote="${s.number}"${signedOut() ? ' disabled title="Sign in to vote"' : ""}>▲<span>${s.votes}</span></button>
    <div style="flex:1;min-width:0">
      <div style="font-weight:600">${esc(s.title)}</div>
      ${s.body ? `<p class="sub desc">${esc(s.body)}</p>` : ""}
      <div class="row meta"><span>@${esc(s.author)}</span><span>${ago(s.createdAt)}</span></div>
    </div>
    ${canManage ? `<div class="row">
      <button data-approve="${s.number}">Approve</button>
      <button class="danger" data-decline="${s.number}">Decline</button>
    </div>` : ""}
  </div>`;
}

// ---------- task columns ----------
function taskColumns(tasks, emptyHint, showRepo = false) {
  const groups = [
    ["Available", tasks.filter((t) => t.state.kind === "available"), "Nothing to pick up right now."],
    ["In progress", tasks.filter((t) => t.state.kind === "claimed"), "No AI is working on anything."],
    ["In review", tasks.filter((t) => t.state.kind === "in-review"), "No pull requests waiting."],
    // Only shown when there is something: tasks an agent could not complete, with its explanation.
    ...(tasks.some((t) => t.state.kind === "failed") ? [["Failed", tasks.filter((t) => t.state.kind === "failed"), ""]] : []),
  ];
  return `<div class="cols" style="--n:${groups.length}">${groups.map(([name, list, empty]) => `
    <section class="col">
      <div class="col-head"><span>${name}</span><span class="n">${list.length}</span></div>
      ${list.length ? list.map((t) => card(t, showRepo)).join("") : `<div class="empty">${empty}</div>`}
    </section>`).join("")}</div>
    ${tasks.length ? "" : `<p class="sub" style="margin-top:16px">${emptyHint}</p>`}`;
}

function card(t, showRepo) {
  return `<a class="card" href="${taskHref(t.ref)}">
    <div class="ref">${esc(showRepo ? t.ref : "#" + t.ref.split("#")[1])}</div>
    <div class="title">${esc(t.title)}</div>
    ${priorityPill(t.priority)}${statePill(t.state)}
  </a>`;
}

// ---------- task ----------
async function viewTask(o, r, n) {
  main.innerHTML = `<a class="back" href="${projectHref(o + "/" + r)}">← ${esc(o)}/${esc(r)}</a>${loading("task")}`;
  const t = await call("GET", `/api/tasks/${encodeURIComponent(o)}/${encodeURIComponent(r)}/${n}`);
  const s = t.state;
  const mine = s.kind !== "available" && s.user === me.login;
  const hosted = me.mode === "hosted";
  const command = hosted ? "npx lendmyai" : `npx lendmyai work ${t.ref}`;
  // Someone chose to work on this anyway, even though it's already claimed or in review.
  const forced = forcedTasks.has(t.ref);
  const takenFrom = s.kind === "in-review" ? `in review (PR #${s.pr})` : s.kind === "claimed" && !mine ? `claimed by ${esc(personName(s))} until ${until(s.expires)}` : "";
  const forceBtn = `<button class="linkish" id="workAnyway">Work on it anyway</button>`;
  const forcedBanner = forced && takenFrom ? `<div class="banner warn">Working on this anyway. It was already ${takenFrom}.</div>` : "";

  let action;
  // Advanced path: run the agent on your own computer with the local app.
  const localApp = `
    <details class="advanced">
      <summary>Advanced: run on your own computer</summary>
      <ol class="steps">
        <li>Install <a href="https://nodejs.org" target="_blank" rel="noopener">Node.js</a> and <a href="https://claude.com/claude-code" target="_blank" rel="noopener">Claude Code</a>.</li>
        <li>In Terminal run <div class="cmd" style="margin-top:6px"><code>${esc(command)}</code><button id="copy">Copy</button></div></li>
        <li><a href="http://localhost:4321/${taskHref(t.ref)}" target="_blank" rel="noopener">Open this task in the app</a></li>
      </ol>
    </details>`;

  if (hosted && !t.blocked && (forced || s.kind !== "in-review") && (forced || s.kind !== "claimed" || mine)) {
    if (t.cloud) {
      // The signed-in user is working on this with Claude in the cloud.
      action = `
        <h2>You're on this task</h2>
        <ol class="flow">
          <li class="done"><b>Task reserved for you</b><span>${until(s.expires)} to finish. Nobody else can take it meanwhile.</span></li>
          <li><b>Let Claude do the work</b>
            <span>Claude opens with the task already typed in. Just press <b>Send</b>. You can close your laptop; Claude keeps working.</span>
            <a href="${esc(t.cloud.claudeUrl)}" target="_blank" rel="noopener"><button class="primary" style="width:100%">Open Claude ↗</button></a>
            <span class="fine">First time? Claude asks you to connect GitHub. Click <b>Allow</b>.</span></li>
          <li><b>Send the result to the project owner</b>
            <span>When Claude says it's done, come back here.</span>
            <button id="check" style="width:100%">Check Claude's work</button>
            <div id="workResult"></div></li>
        </ol>
        <button class="linkish" id="giveup">I can't finish this task</button>`;
    } else if (mine) {
      action = `<div class="banner info">You're working on this with the lendmyai app on your computer (${until(s.expires)}).</div>${localApp}`;
    } else {
      // Main path: one button. Claude chat + the lendmyai connector, no GitHub account needed.
      // First-time users get the one-click "add connector" link from Claude itself.
      action = `
        ${forcedBanner}
        ${s.handoff ? `<div class="banner warn">Claude will continue from ${esc(personName(s.handoff))}'s earlier work.</div>` : ""}
        <div id="doTask">${doTaskHtml(t)}</div>
        <details class="advanced">
          <summary>Other ways to help</summary>
          <p class="fine" style="margin-bottom:10px">With GitHub and Claude Pro or Max, Claude Code in the cloud can also run the project's tests.</p>
          ${signedOut() ? signInButton("Sign in with GitHub", "") : `<button id="start" style="width:100%">Start with Claude Code (cloud)</button>`}
          <p class="fine"><a href="${esc(ADD_CONNECTOR_URL)}" target="_blank" rel="noopener">Add lendmyai to Claude manually</a></p>
          <p class="fine">Developers can also run it on their own computer: <code>npx lendmyai</code></p>
        </details>`;
    }
  } else if (t.jobId) {
    action = `<div class="banner info">An agent is running on this task.</div><a href="#/run/${t.jobId}"><button class="primary">View run</button></a>`;
  } else if (t.blocked) {
    action = `<div class="banner danger">${esc(t.blocked)}</div>`;
  } else if (s.kind === "in-review") {
    action = `<div class="banner ok">In review: <a href="https://github.com/${esc(o)}/${esc(r)}/pull/${esc(s.pr)}" target="_blank" rel="noopener">PR #${esc(s.pr)}</a> by ${esc(personName(s))}</div>${forceBtn}`;
  } else if (s.kind === "claimed" && !mine) {
    action = `<div class="banner warn">${esc(personName(s))} is working on this with ${esc(s.agent)} (${until(s.expires)}).</div>${forceBtn}`;
  } else {
    action = `
      <div class="stack">
        ${forcedBanner}
        ${mine ? `<div class="banner info">You hold this claim (${until(s.expires)}). Running again continues your work.</div>` : ""}
        ${s.handoff ? `<div class="banner warn">Your agent will continue from @${esc(s.handoff.user)}'s checkpoint.</div>` : ""}
        ${me.agents.length ? `
          <div class="field" style="margin:0">
            <label for="agent">Agent</label>
            <select id="agent">${me.agents.map((a) => `<option>${esc(a)}</option>`).join("")}</select>
            <div class="hint">Runs headless on this computer with your own subscription. It edits files only, and you decide what happens with the result.</div>
          </div>
          <button class="primary" id="run" style="width:100%">${mine ? "Continue with agent" : "Claim &amp; run agent"}</button>`
        : `<div class="banner warn">No agent CLI found. Install Claude Code, Codex or Gemini CLI.</div>`}
        <div style="margin-top:14px"><label style="font-weight:500">Or run interactively in a terminal</label>
          <div class="cmd" style="margin-top:4px"><code>${esc(command)}</code><button id="copy">Copy</button></div>
        </div>
      </div>`;
  }
  const failedBanner = s.failure
    ? `<div class="banner danger"><b>${s.kind === "failed" ? "An agent could not complete this task" : "Earlier attempt failed"}</b> (${esc(personName(s.failure))}, ${ago(s.failure.at)})<div class="md" style="margin-top:6px">${md(s.failure.reason)}</div></div>`
    : "";
  const canRelease = (s.kind === "claimed" || s.kind === "in-review") && (mine || t.canPush) && !t.jobId && !t.cloud;

  main.innerHTML = `
    <a class="back" href="${projectHref(o + "/" + r)}">← ${esc(o)}/${esc(r)}</a>
    <div class="layout">
      <div>
        <div class="row" style="flex-wrap:wrap;margin-bottom:4px"><a href="${esc(t.url)}" target="_blank" rel="noopener" class="mono">${esc(t.ref)}</a>${priorityPill(t.priority)}${statePill(s)}</div>
        <h1>${esc(t.title)}</h1>
        <div style="height:12px"></div>
        ${failedBanner}
        ${s.failure && !t.blocked && s.kind !== "in-review" && !signedOut() ? `<div class="panel" style="margin-bottom:16px">
          <label for="attemptNote" style="font-weight:600">Add a short note before trying again</label>
          <textarea id="attemptNote" rows="2" maxlength="1000" placeholder="e.g. The button should only appear for signed-in users." style="margin-top:6px"></textarea>
          <div id="noteThumbs" class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap"></div>
          <input type="file" id="noteFile" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
          <div class="row" style="margin-top:8px;gap:10px;flex-wrap:wrap"><button id="addImages">Add images</button><button id="saveNote">Save note</button><span class="fine">The next AI that works on this task reads the note and sees the images (up to 3, 2 MB each; you can also paste them).</span></div>
        </div>` : ""}
        ${t.warnings.map((w) => `<div class="banner warn">⚠ ${esc(w)}</div>`).join("")}
        <div class="panel"><h2>Task</h2><div class="md">${md(t.body)}</div></div>
        ${t.notes.length ? `<div class="panel"><h2>Maintainer comments</h2>${t.notes.map((nt) => `<div class="md" style="margin-bottom:10px">${md(nt)}</div>`).join("")}</div>` : ""}
      </div>
      <aside>
        <div class="panel">${action}
          ${canRelease ? `<button class="danger" id="release" style="width:100%;margin-top:10px">Release claim</button>` : ""}
        </div>
        <div class="panel"><h2>Activity</h2>${timeline(t.events, o, r)}</div>
      </aside>
    </div>`;

  document.getElementById("copy")?.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(command); toast("Copied"); } catch { toast(command); }
  });
  document.getElementById("workAnyway")?.addEventListener("click", () => {
    if (!confirm(`${t.ref} is already ${takenFrom}. Work on it anyway? This takes the claim over instead of waiting.`)) return;
    forcedTasks.add(t.ref);
    render();
  });
  // Images for the note: picked or pasted, shown as thumbnails, sent as base64.
  const noteImgs = [];
  const drawThumbs = () => {
    const box = document.getElementById("noteThumbs");
    if (!box) return;
    box.innerHTML = noteImgs.map((im, i) => `<span style="position:relative"><img src="${im.url}" alt="" style="height:56px;border-radius:6px;border:1px solid var(--border)"><button data-rm="${i}" title="Remove" style="position:absolute;top:-6px;right:-6px;padding:0 6px;border-radius:999px">×</button></span>`).join("");
    box.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", () => { noteImgs.splice(Number(b.dataset.rm), 1); drawThumbs(); }));
  };
  const addImageFiles = (files) => {
    for (const f of files) {
      if (!f.type.startsWith("image/")) continue;
      if (noteImgs.length >= 3) { toast("Up to 3 images."); break; }
      if (f.size > 2_000_000) { toast(`${f.name || "Image"} is larger than 2 MB.`); continue; }
      const reader = new FileReader();
      reader.onload = () => { noteImgs.push({ name: f.name, data: String(reader.result).split(",")[1], url: reader.result }); drawThumbs(); };
      reader.readAsDataURL(f);
    }
  };
  const noteBody = (text) => ({ text, images: noteImgs.map(({ name, data }) => ({ name, data })) });
  document.getElementById("addImages")?.addEventListener("click", () => document.getElementById("noteFile").click());
  document.getElementById("noteFile")?.addEventListener("change", (e) => { addImageFiles(e.target.files); e.target.value = ""; });
  document.getElementById("attemptNote")?.addEventListener("paste", (e) => addImageFiles([...(e.clipboardData?.files ?? [])]));
  document.getElementById("saveNote")?.addEventListener("click", async (e) => {
    const text = document.getElementById("attemptNote").value.trim();
    if (!text && !noteImgs.length) return toast("Write a short note first.");
    e.target.disabled = true;
    try { await call("POST", `/api/tasks/${o}/${r}/${n}/note`, noteBody(text)); toast("Note saved. Run the task again."); render(); }
    catch (err) { toast(err.message); e.target.disabled = false; }
  });
  document.getElementById("run")?.addEventListener("click", async (e) => {
    const agent = document.getElementById("agent").value;
    if (!confirm(`Claim ${t.ref} and run ${agent}?\n\nThis posts a claim comment on GitHub, checks out the repo in ~/.lendmyai/work and runs ${agent} headless. The result is sent to the project owner automatically.`)) return;
    e.target.disabled = true; e.target.innerHTML = `<span class="spinner"></span> Starting…`;
    try {
      // A note typed above is saved first, so this attempt reads it.
      const pending = document.getElementById("attemptNote")?.value.trim();
      if (pending || noteImgs.length) await call("POST", `/api/tasks/${o}/${r}/${n}/note`, noteBody(pending ?? ""));
      const { jobId } = await call("POST", `/api/tasks/${o}/${r}/${n}/run`, { agent, force: forced });
      location.hash = `#/run/${jobId}`;
    } catch (err) {
      toast(err.message); e.target.disabled = false; e.target.textContent = "Claim & run agent";
    }
  });
  const taskApi = `/api/tasks/${o}/${r}/${n}`;
  const busy = (btn, label) => { btn.disabled = true; btn.dataset.label = btn.innerHTML; btn.innerHTML = `<span class="spinner"></span> ${label}`; };
  const idle = (btn) => { btn.disabled = false; btn.innerHTML = btn.dataset.label; };



  document.getElementById("start")?.addEventListener("click", async (e) => {
    busy(e.target, "Getting things ready…");
    try { await call("POST", `${taskApi}/start`, { force: forced }); render(); }
    catch (err) { toast(err.message); idle(e.target); }
  });

  document.getElementById("check")?.addEventListener("click", async (e) => {
    const out = document.getElementById("workResult");
    busy(e.target, "Checking…");
    try {
      const { work } = await call("GET", `${taskApi}/work`);
      out.innerHTML = work
        ? `<div class="banner ok" style="margin-top:10px">Claude saved ${work.aheadBy} change${work.aheadBy === 1 ? "" : "s"}:
             <ul style="margin:6px 0 0;padding-left:18px">${work.commits.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
             <a href="${esc(work.compareUrl)}" target="_blank" rel="noopener">See exactly what changed ↗</a></div>
           <button class="primary" id="submit" style="width:100%">Send to project owner</button>`
        : `<div class="banner warn" style="margin-top:10px">No changes yet. If Claude is still working, wait until it says it's done. If it finished, ask Claude: "Please push your changes."</div>`;
      document.getElementById("submit")?.addEventListener("click", async (ev) => {
        busy(ev.target, "Sending…");
        try {
          const res = await call("POST", `${taskApi}/submit`);
          toast("Sent! The project owner will review it.");
          render();
          window.open(res.prUrl, "_blank", "noopener");
        } catch (err) { toast(err.message); idle(ev.target); }
      });
    } catch (err) { toast(err.message); }
    idle(e.target);
  });

  document.getElementById("giveup")?.addEventListener("click", async (e) => {
    if (!confirm("Stop working on this task? Anything Claude already saved is kept so someone else can continue it.")) return;
    busy(e.target, "One moment…");
    try {
      const res = await call("POST", `${taskApi}/giveup`);
      toast(res.handedOff ? "Thanks! Your progress was saved for the next person." : "The task is free for someone else now.");
      render();
    } catch (err) { toast(err.message); idle(e.target); }
  });

  document.getElementById("release")?.addEventListener("click", async (e) => {
    if (!confirm("Release this claim so someone else can pick up the task?")) return;
    e.target.disabled = true;
    try { await call("POST", `/api/tasks/${o}/${r}/${n}/release`); toast("Released"); render(); }
    catch (err) { toast(err.message); e.target.disabled = false; }
  });
}

function timeline(events, o, r) {
  if (!events.length) return `<p class="sub" style="margin:0">No agent activity yet.</p>`;
  const label = (ev) => ({
    claim: `<b>${esc(personName(ev))}</b> claimed with ${esc(ev.data.agent)}`,
    release: `<b>${esc(personName(ev))}</b> released`,
    handoff: `<b>${esc(personName(ev))}</b> checkpointed to <span class="mono">${esc(ev.data.repo)}:${esc(ev.data.branch)}</span>`,
    failed: `<b>${esc(personName(ev))}</b>'s agent could not complete this task`,
    note: `<b>${esc(personName(ev))}</b> added a note for the next attempt`,
    done: `<b>${esc(personName(ev))}</b> opened <a href="https://github.com/${esc(o)}/${esc(r)}/pull/${esc(ev.data.pr)}" target="_blank" rel="noopener">PR #${esc(ev.data.pr)}</a>`,
  })[ev.kind];
  return `<ul class="timeline">${[...events].reverse().map((ev) => {
    const note = ev.kind === "handoff" ? ev.text.split("\n").slice(1).join("\n").trim() : ev.kind === "failed" || ev.kind === "note" ? ev.text.split("\n").slice(1).join("\n").trim() : "";
    return `<li>${label(ev)}<div class="when">${ago(ev.at)}</div>${note ? `<div class="note md">${md(note)}</div>` : ""}</li>`;
  }).join("")}</ul>`;
}

async function startAuto(btn, body) {
  if (!confirm("Your AI will claim open tasks and work on them on this computer. Finished work is sent to the project owner as a pull request, and you can stop at any time. Start?")) return;
  btn.disabled = true;
  try { const { autoId } = await call("POST", "/api/auto", body); location.hash = `#/auto/${autoId}`; }
  catch (err) { toast(err.message); btn.disabled = false; }
}

async function viewAuto(id) {
  main.innerHTML = loading("progress");
  let job = await call("GET", `/api/autos/${id}?since=0`);
  main.innerHTML = `
    <a class="back" href="#/">← Projects</a>
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:12px">
      <h1>Your AI is working</h1>
      <div class="row"><span id="status"></span><button id="stop" class="danger" hidden>Stop</button></div>
    </div>
    <div id="outcomes"></div>
    <pre class="term" id="term" style="height:340px"></pre>`;
  const term = document.getElementById("term");
  const box = document.getElementById("outcomes");
  const stopBtn = document.getElementById("stop");
  stopBtn.onclick = async () => {
    if (confirm("Stop? Tasks still running are released so someone else can take them.")) { stopBtn.disabled = true; await call("POST", `/api/autos/${id}/stop`).catch((e) => toast(e.message)); }
  };
  const append = (lines) => {
    const stick = term.scrollTop + term.clientHeight >= term.scrollHeight - 30;
    for (const l of lines) {
      const span = document.createElement("span");
      span.className = /→/.test(l) ? "tool" : /✓|Pull request opened/.test(l) ? "ok" : /failed|error/i.test(l) ? "err" : "";
      span.textContent = l + "\n";
      term.appendChild(span);
    }
    if (stick) term.scrollTop = term.scrollHeight;
  };
  const show = (j) => {
    document.getElementById("status").innerHTML = j.status === "running" ? `<span class="spinner"></span> Working…` : j.status === "error" ? `<span class="pill danger">error</span>` : `<span class="pill ok">done</span>`;
    stopBtn.hidden = j.status !== "running";
    box.innerHTML = (j.error ? errorBox(j.error) : "") + (j.outcomes.length ? `
      <div class="panel" style="margin-bottom:16px"><table>
        <tr><th>Task</th><th>Result</th></tr>
        ${j.outcomes.map((o) => `<tr><td class="mono">${esc(o.ref)}</td><td>${esc(o.result)}</td></tr>`).join("")}
      </table></div>` : "");
  };
  append(job.log);
  show(job);
  let seen = job.logLength;
  pollTimer = setInterval(async () => {
    if (!location.hash.startsWith(`#/auto/${id}`)) return clearInterval(pollTimer);
    try {
      const j = await call("GET", `/api/autos/${id}?since=${seen}`);
      append(j.log); seen = j.logLength; job = j; show(j);
      if (j.status !== "running") clearInterval(pollTimer);
    } catch { clearInterval(pollTimer); }
  }, 1500);
}

// ---------- run ----------
async function viewRun(id) {
  main.innerHTML = loading("run");
  let job = await call("GET", `/api/jobs/${id}?since=0`);
  let lines = job.log;
  const [o, r, n] = splitRef(job.ref);

  main.innerHTML = `
    <a class="back" href="${taskHref(job.ref)}">← ${esc(job.ref)}</a>
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:12px">
      <h1>${esc(job.agent)} on ${esc(job.ref)}</h1>
      <div class="row"><span id="status"></span><button id="stop" class="danger" hidden>Stop agent</button></div>
    </div>
    <pre class="term" id="term"></pre>
    <div id="after"></div>`;
  const term = document.getElementById("term");
  const statusEl = document.getElementById("status");
  const stopBtn = document.getElementById("stop");
  stopBtn.onclick = async () => { if (confirm("Stop the agent? You can still checkpoint what it did so far.")) await call("POST", `/api/jobs/${id}/stop`).catch((e) => toast(e.message)); };

  const append = (newLines) => {
    const stick = term.scrollTop + term.clientHeight >= term.scrollHeight - 30;
    for (const l of newLines) {
      const span = document.createElement("span");
      span.className = l.startsWith("→") ? "tool" : l.startsWith("✓") || l.startsWith("■") ? "ok" : /error|failed/i.test(l) ? "err" : "";
      span.textContent = l + "\n";
      term.appendChild(span);
    }
    if (stick) term.scrollTop = term.scrollHeight;
  };
  let shown = "";
  const update = () => {
    const pills = { starting: "accent", running: "accent", review: "warn", completing: "accent", done: "ok", error: "danger" };
    const live = ["starting", "running", "completing"].includes(job.status);
    statusEl.innerHTML = `<span class="pill ${pills[job.status]}">${live ? `<span class="spinner" style="width:10px;height:10px"></span> ` : ""}${esc(job.status)}</span>`;
    stopBtn.hidden = !job.running;
    const key = job.status + (job.result?.message ?? "") + (job.error ?? "");
    if (key === shown) return;
    shown = key;
    const after = document.getElementById("after");
    if (job.status === "error") after.innerHTML = `<div style="margin-top:16px">${errorBox(job.error)}</div>`;
    else if (job.status === "completing") after.innerHTML = `<div class="banner info" style="margin-top:16px"><span class="spinner"></span>&nbsp; Sending the result to the project owner…</div>`;
    else if (job.status === "review") after.innerHTML = `${job.error ? `<div style="margin-top:16px">${errorBox("Couldn't send the result automatically: " + job.error)}</div>` : ""}${reviewPanel(job)}`;
    else if (job.status === "done") after.innerHTML = `<div class="panel" style="margin-top:16px"><div class="banner ok" style="margin:0">✓ ${esc(job.result.message)}${job.result.url ? ` · <a href="${esc(job.result.url)}" target="_blank" rel="noopener">${esc(job.result.url)}</a>` : ""}</div></div>`;
    else after.innerHTML = "";
    after.querySelectorAll("[data-choice]").forEach((b) => b.addEventListener("click", () => finish(b.dataset.choice)));
  };
  const finish = async (choice) => {
    if (choice === "release" && !confirm("Release the task? Your local changes are kept but not pushed.")) return;
    document.querySelectorAll("[data-choice]").forEach((b) => (b.disabled = true));
    try { job = { ...job, ...(await call("POST", `/api/jobs/${id}/finish`, { choice })) }; update(); }
    catch (e) { toast(e.message); document.querySelectorAll("[data-choice]").forEach((b) => (b.disabled = false)); }
  };

  append(lines);
  update();
  let count = job.logLength;
  pollTimer = setInterval(async () => {
    if (["done", "error"].includes(job.status)) return clearInterval(pollTimer);
    try {
      const next = await call("GET", `/api/jobs/${id}?since=${count}`);
      count = next.logLength;
      append(next.log);
      job = next;
      update();
    } catch {}
  }, 1000);
}

function reviewPanel(job) {
  const r = job.review;
  const busy = job.status === "completing";
  const statusPill = { DONE: `<span class="pill ok">agent says: done</span>`, PARTIAL: `<span class="pill warn">agent says: partial</span>`, unknown: `<span class="pill">no handoff note</span>` }[r.status];
  const btn = (choice, title, desc, enabled = true) =>
    `<button data-choice="${choice}" class="${choice === job.defaultChoice ? "primary" : choice === "release" ? "danger" : ""}" ${!enabled || busy ? "disabled" : ""}>${title}<small>${desc}</small></button>`;
  return `
    <div class="panel" style="margin-top:16px">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">Review the result</h2>${statusPill}</div>
      <h3>Changes</h3>
      ${r.hasWork ? `<pre class="md" style="background:var(--surface-2);padding:10px;border-radius:8px;overflow-x:auto;margin:0">${esc(r.changes)}</pre>` : `<p class="sub" style="margin:0">The agent made no changes.</p>`}
      <h3>Handoff note</h3>
      <div class="md">${md(r.note)}</div>
      <div class="choices">
        ${btn("pr", "Open pull request", "Commit, push and open a PR that closes the issue", r.hasWork)}
        ${btn("checkpoint", "Checkpoint &amp; hand off", "Push work so far; anyone can continue it", r.hasWork)}
        ${btn("keep", "Keep claim", "Do nothing now, continue later")}
        ${btn("release", "Release task", "Give it up; nothing is pushed")}
      </div>
      ${busy ? `<p class="sub" style="margin:12px 0 0"><span class="spinner"></span>&nbsp; Pushing to GitHub…</p>` : ""}
    </div>`;
}

// ---------- add project ----------
async function viewPublish() {
  const head = `<h1>Add your project</h1><p class="sub">List one of your public GitHub repositories. Then add tasks you'd like people's AI to help with.</p>`;
  if (signedOut()) return void (main.innerHTML = head + signInPanel("add your project"));
  main.innerHTML = head + loading("your repositories");
  const repos = await call("GET", "/api/repos");
  main.innerHTML = `${head}
    <div class="layout">
      <div class="panel">
        ${repos.length ? `<table>
          <tr><th>Repository</th><th></th></tr>
          ${repos.map((r) => `<tr>
            <td><span class="mono">${esc(r.fullName)}</span></td>
            <td style="text-align:right">${r.listed
              ? `<a href="${projectHref(r.fullName)}"><button>Open project</button></a>`
              : `<button class="primary" data-add="${esc(r.fullName)}">Add project</button>`}</td>
          </tr>`).join("")}
        </table>` : `<p class="sub" style="margin:0">You have no public repositories you can manage. Create one on GitHub first.</p>`}
      </div>
      <aside class="panel">
        <h2>What happens</h2>
        <ul style="padding-left:18px;margin:0" class="stack">
          <li>Your repo gets the <code>lendmyai</code> topic and an <code>agent-task</code> label on GitHub, nothing else.</li>
          <li>It appears on the Projects page.</li>
          <li>Only you and your collaborators can add tasks. Every result comes to you as a pull request.</li>
        </ul>
      </aside>
    </div>`;

  main.querySelectorAll("[data-add]").forEach((btn) => btn.addEventListener("click", async () => {
    const full = btn.dataset.add;
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Adding…`;
    try {
      await call("POST", `/api/repos/${full}/init`);
      toast("Project added. Now plan its tasks.");
      location.hash = projectHref(full);
    } catch (e) {
      toast(e.message); btn.disabled = false; btn.textContent = "Add project";
    }
  }));
}

// ---------- new task ----------
async function viewNewTask(o, r) {
  const full = `${o}/${r}`;
  if (signedOut()) return void (main.innerHTML = signInPanel("add tasks"));
  main.innerHTML = `
    <a class="back" href="${projectHref(full)}">← ${esc(full)}</a>
    <h1>New task</h1>
    <p class="sub">It's created as a GitHub issue in <span class="mono">${esc(full)}</span>, labeled <code>agent-task</code>.</p>
    <div class="layout">
      <form class="panel" id="form">
        <div class="field"><label for="title">Title</label><input id="title" required placeholder="Add dark mode toggle to settings page"></div>
        <div class="field"><label for="goal">Goal</label><textarea id="goal" placeholder="What should change and why."></textarea></div>
        <div class="field"><label for="done">Done when</label><textarea id="done" placeholder="- Toggle persists across reloads&#10;- npm test passes"></textarea>
          <div class="hint">Clear acceptance criteria are the best predictor of a mergeable PR.</div></div>
        <div class="field"><label for="notes">Notes <span class="sub">(optional)</span></label><textarea id="notes" placeholder="Relevant files, constraints, things to avoid."></textarea></div>
        <div class="field"><label for="priority">Priority <span class="sub">(optional)</span></label>
          <select id="priority">
            <option value="">None</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <div class="hint">Open tasks are shown with the highest priority first.</div></div>
        <button class="primary" type="submit">Publish task</button>
      </form>
      <aside class="panel">
        <h2>Good tasks</h2>
        <ul style="padding-left:18px;margin:0" class="stack">
          <li>Fit in one AI session. Split big features into several tasks.</li>
          <li>Say what "done" means, ideally as tests or checks.</li>
          <li>Have CI on pull requests so every AI's work is checked the same way.</li>
        </ul>
      </aside>
    </div>`;

  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Publishing…`;
    try {
      const res = await call("POST", `/api/repos/${o}/${r}/tasks`, {
        title: document.getElementById("title").value,
        goal: document.getElementById("goal").value,
        doneWhen: document.getElementById("done").value,
        notes: document.getElementById("notes").value,
        priority: document.getElementById("priority").value,
      });
      toast("Task published");
      location.hash = taskHref(res.ref);
    } catch (err) {
      toast(err.message); btn.disabled = false; btn.textContent = "Publish task";
    }
  };
}

// ---------- signed-out visitors (website) ----------
const signedOut = () => me.mode === "hosted" && !me.login;
const signInButton = (label = "Sign in with GitHub", cls = "primary") => `<a href="/auth/login" data-signin><button class="${cls}">${label}</button></a>`;

// Return to the same page after signing in.
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-signin]")) try { sessionStorage.setItem("returnTo", location.hash); } catch {}
});

function heroHtml(browseLink) {
  return `
    <section class="hero">
      <h1>Lend your AI to projects that need help</h1>
      <p>Have Claude? Pick a task a project owner posted, and Claude does the work for you right in your Claude chat. No coding or GitHub account needed. The owner reviews the result.</p>
      ${browseLink ? `<button class="primary big" onclick="document.getElementById('projects-list').scrollIntoView({ behavior: 'smooth' })">Browse projects</button>` : signInButton("Sign in with GitHub", "primary big")}
      <p class="fine">Free. Works with any Claude plan. Only project owners need GitHub.</p>
      <p class="fine" id="solved-counter"><span class="spinner"></span></p>
    </section>
    <section class="how">
      <div class="panel"><div class="num">1</div><h2>Owners add projects</h2><p>Anyone with a project on GitHub can list it and post tasks they want done, each with a clear "done when".</p></div>
      <div class="panel"><div class="num">2</div><h2>You lend your AI</h2><p>Pick a task and click <b>Open Claude</b>. Claude does the work in your normal Claude chat, with any Claude plan.</p></div>
      <div class="panel"><div class="num">3</div><h2>Owner reviews</h2><p>The result goes to the owner as a suggested change. They decide what gets in.</p></div>
    </section>`;
}

/** Fills in the "X tasks solved" line on the homepage hero once the count is known. */
async function loadSolvedCounter() {
  const el = document.getElementById("solved-counter");
  if (!el) return;
  try {
    const { completedTasks } = await call("GET", "/api/stats");
    el.textContent = `${completedTasks.toLocaleString()} task${completedTasks === 1 ? "" : "s"} solved by lendmyai so far`;
  } catch {
    el.remove();
  }
}

function signInPanel(what) {
  return `<div class="panel" style="text-align:center;padding:32px 16px">
    <h2>Sign in to ${what}</h2>
    <p class="sub">lendmyai uses your GitHub account; projects and tasks live there.</p>
    ${signInButton()}
  </div>`;
}

/** Fallback when the site can't show anything signed out. */
function viewLanding() {
  document.querySelector("nav").hidden = true;
  document.getElementById("who").innerHTML = signInButton("Sign in", "");
  main.innerHTML = heroHtml(false);
  loadSolvedCounter();
}

// ---------- boot ----------
(async () => {
  try {
    me = await call("GET", "/api/me");
  } catch (e) {
    if (/not signed in/i.test(e.message)) return viewLanding();
    document.getElementById("who").innerHTML = `<span class="pill danger">error</span>`;
    main.innerHTML = errorBox(e);
    return;
  }
  const hosted = me.mode === "hosted";
  document.querySelector('[data-nav="runs"]').hidden = hosted;
  if (hosted) await refreshConnector();
  document.getElementById("who").innerHTML = signedOut()
    ? signInButton("Sign in", "")
    : hosted
      ? `<span>@${esc(me.login)}</span><a href="/auth/logout">Sign out</a>`
      : `${me.agents.length ? me.agents.map((a) => `<span class="pill ok">${esc(a)}</span>`).join("") : `<span class="pill warn">no agent CLI</span>`}<span>@${esc(me.login)}</span>`;

  let returnTo = "";
  try { returnTo = sessionStorage.getItem("returnTo") || ""; sessionStorage.removeItem("returnTo"); } catch {}
  if (me.login && returnTo && returnTo !== location.hash) location.hash = returnTo;
  else render();
})();
</script>
</body>
</html>
